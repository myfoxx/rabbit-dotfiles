# [green] recoll full-text — SOLO formati documento in ~/Documents.
# ~/Documents = 253G / ~1M file: indicizzare tutto e' spreco.
# indexedmimetypes = whitelist (SOLO questi MIME entrano nell'indice)
# indexallfilenames = 0 -> non indicizzare nemmeno i NOMI dei file fuori whitelist
#   (altrimenti recoll aggiunge comunque ogni jpeg/video/exe solo per il nome)
topdirs = ~/Documents

indexallfilenames = 0
indexedmimetypes = application/pdf \
  application/vnd.openxmlformats-officedocument.wordprocessingml.document \
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet \
  application/vnd.openxmlformats-officedocument.presentationml.presentation \
  application/msword application/vnd.ms-excel application/vnd.ms-powerpoint \
  application/vnd.oasis.opendocument.text application/vnd.oasis.opendocument.spreadsheet \
  application/vnd.oasis.opendocument.presentation \
  application/rtf text/rtf text/plain text/html text/markdown text/csv \
  application/epub+zip

# skippedNames = glob su BASENAME (file o cartella). Escludo:
#  - cartelle dev/build/librerie (gonfiano l'indice con json/scss/yml di repo)
#  - estensioni "codice travestito da text/plain" (json/yml/scss/css/...)
# Risultato: restano i documenti VERI (pdf/docx/xlsx/pptx/odt/txt/md/csv/html/rtf/epub).
skippedNames = node_modules venv .venv __pycache__ .git .svn .cache cache Cache \
  dist build out target vendor .next .nuxt .terraform .gradle .idea .vscode \
  Libraries lib libs third_party deps bower_components \
  "Adobe Acrobat" AnyDesk Cline \
  *.part *.tmp *.lock *.min.js *.min.css *.map \
  *.json *.yml *.yaml *.scss *.sass *.css *.toml *.ini *.cfg *.conf \
  *.js *.ts *.jsx *.tsx *.py *.sh *.rs *.go *.c *.h *.cpp *.hpp *.java *.php *.rb *.sql \
  *.log *.lock package-lock.json yarn.lock Cargo.lock
followLinks = 0

# aspell: niente dizionario suggerimenti (lang=en non installato, buildDict fallisce e rallenta)
noaspell = 1
